<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Inmobiliaria</title>
<style>
  :root {
    --bg: #f9f8f6;
    --panel: #ffffff;
    --surface: #f4f3f0;
    --surface-2: #ecebe7;
    --border: #e8e6e1;
    --text: #292524;
    --text-soft: #57534e;
    --muted: #8a877e;
    --accent: #4d6bfe;
    --accent-soft: #eef1ff;
    --ok: #16a34a;
    --danger: #dc2626;
    --user-bubble: #f4f3f0;
    --shadow: 0 12px 32px rgba(60, 55, 45, .08);
    --shadow-float: 0 18px 50px rgba(60, 55, 45, .16);
    --radius: 16px;
    --maxw: 760px;
  }
  html[data-theme="dark"] {
    --bg: #212121;
    --panel: #262626;
    --surface: #2e2e2e;
    --surface-2: #383838;
    --border: #3f3f3f;
    --text: #ececec;
    --text-soft: #c8c8c8;
    --muted: #9c9c9c;
    --accent: #6b7fff;
    --accent-soft: #2a2f4d;
    --user-bubble: #3a3a3a;
    --shadow: 0 12px 32px rgba(0, 0, 0, .35);
    --shadow-float: 0 18px 50px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background .3s;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  button { font-family: inherit; }

  /* ===== Header minimal ===== */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex: 1; min-width: 0; }
  .brand h1 { font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
  .brand .model {
    font-size: 12px; color: var(--muted);
    margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .head-right { display: flex; align-items: center; gap: 8px; }
  #status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    white-space: nowrap;
  }
  #status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--danger); transition: background .3s;
  }
  #status.ok { color: var(--ok); }
  #status.ok::before { background: var(--ok); box-shadow: 0 0 8px rgba(22,163,74,.6); }
  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text-soft);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); color: var(--accent); border-color: var(--accent); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ===== Layout: chat + sidebar de documentos ===== */
  #layout { flex: 1; display: flex; min-height: 0; }
  main {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    min-width: 0;
  }
  #chat {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 36px 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  aside {
    flex: none;
    width: 310px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    transition: margin-right .28s ease;
  }
  aside.hidden { margin-right: -310px; }
  .docs-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted);
    position: sticky; top: 0;
    background: var(--panel);
    z-index: 2;
  }
  .docs-head .n {
    margin-left: auto;
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 9px;
    letter-spacing: 0;
    text-transform: none;
  }
  #doc-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .doc {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 13px;
    cursor: pointer;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    font-family: inherit;
  }
  .doc:hover { transform: translateY(-1px); border-color: var(--accent); box-shadow: var(--shadow); }
  .d-ic {
    flex: none;
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    align-self: flex-start;
  }
  .d-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .d-txt b { font-size: 12.5px; font-weight: 700; color: var(--text); word-break: break-all; overflow-wrap: anywhere; white-space: normal; line-height: 1.4; }
  .d-txt i { font-style: normal; font-size: 11.5px; color: var(--muted); }
  .docs-empty {
    font-size: 12.5px; color: var(--muted);
    text-align: center;
    padding: 24px 16px;
    line-height: 1.6;
  }

  /* ===== Bienvenida ===== */
  .welcome { text-align: center; padding: 40px 0 10px; animation: rise .5s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .welcome .logo-big {
    width: 56px; height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, #4d6bfe, #8b5cf6);
    display: grid; place-items: center;
    margin: 0 auto 22px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(77, 107, 254, .4);
  }
  .welcome h2 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 8px; }
  .welcome p { font-size: 14.5px; color: var(--muted); max-width: 500px; margin: 0 auto 30px; line-height: 1.6; }
  .suggest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
    text-align: left;
  }
  .sug {
    display: flex; align-items: flex-start; gap: 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 17px;
    cursor: pointer;
    text-align: left;
    transition: transform .18s, box-shadow .18s, border-color .18s;
    font-family: inherit;
  }
  .sug:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
  .sug .ic {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
  }
  .sug b { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 2px; line-height: 1.4; color: var(--text); }
  .sug span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* Mensajes */
  .msg { animation: rise .3s ease; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .text {
    max-width: 78%;
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-bottom-right-radius: 6px;
    padding: 12px 17px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .answer { font-size: 15px; line-height: 1.75; color: var(--text-soft); }
  .msg.bot .answer p { margin: 0 0 10px; }
  .msg.bot .answer p:last-child { margin-bottom: 0; }
  .msg.bot .answer h3 { font-size: 15.5px; font-weight: 800; margin: 14px 0 7px; color: var(--text); }
  .msg.bot .answer ul, .msg.bot .answer ol { margin: 0 0 10px; padding-left: 22px; }
  .msg.bot .answer li { margin-bottom: 4px; }
  .msg.bot .answer code {
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5px 6px;
  }
  .msg.bot .answer pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .msg.bot .answer pre code { background: none; border: none; padding: 0; }
  .msg.bot .answer strong { color: var(--text); font-weight: 700; }
  .cite {
    display: inline-grid; place-items: center;
    min-width: 19px; height: 19px;
    padding: 0 5px;
    font-size: 11.5px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    vertical-align: 2px;
    transition: background .15s, color .15s;
  }
  .cite:hover { background: var(--accent); color: #fff; }

  /* Acciones */
  .actions { margin-top: 12px; display: flex; gap: 8px; }
  .ghost-btn {
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .ghost-btn:hover { color: var(--accent); background: var(--surface); }

  /* Fuentes: tarjetas compactas */
  .sources { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .sources-title {
    font-size: 11.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .sources-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  details.source {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    overflow: hidden;
    transition: border-color .2s;
  }
  details.source[open] { border-color: var(--accent); }
  details.source summary {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    cursor: pointer;
    list-style: none;
    font-size: 13px;
    user-select: none;
  }
  details.source summary::-webkit-details-marker { display: none; }
  .s-ic {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--muted);
    display: grid; place-items: center;
  }
  .s-file { flex: 1; min-width: 0; font-weight: 650; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-page {
    font-size: 11.5px; font-weight: 700;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .chev { color: var(--muted); font-size: 10px; transition: transform .2s; flex: none; }
  details.source[open] .chev { transform: rotate(180deg); }
  .s-body { padding: 0 14px 13px 54px; }
  .s-score { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 4px; border-radius: 4px; background: var(--border); margin-top: 5px; overflow: hidden; }
  .bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    border-radius: 4px;
  }
  .pdf-btn {
    display: block;
    margin: 8px 0 10px;
    font-size: 12.5px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background .15s, color .15s;
    font-family: inherit;
    width: 100%;
    text-align: center;
  }
  .pdf-btn:hover { background: var(--accent); color: #fff; }
  .s-excerpt {
    font-size: 12.5px; line-height: 1.6;
    color: var(--muted);
    max-height: 150px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 12px;
  }

  /* Typing */
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 2px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Error */
  .msg.error .answer {
    border: 1px solid var(--danger);
    border-left: 4px solid var(--danger);
    background: var(--panel);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text-soft);
  }
  .msg.error .answer p { margin-bottom: 6px; }
  .msg.error strong { color: var(--danger); }

  /* ===== Composer ===== */
  footer {
    padding: 12px 24px 14px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .composer {
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .shell {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 9px 10px 9px 20px;
    box-shadow: var(--shadow-float);
    transition: border-color .2s, box-shadow .2s;
  }
  .shell:focus-within { border-color: var(--accent); box-shadow: 0 18px 55px rgba(77, 107, 254, .15); }
  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 150px;
    padding: 7px 0;
  }
  #input::placeholder { color: var(--muted); }
  #send {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
    transition: opacity .15s, transform .15s, background .15s;
    box-shadow: 0 6px 16px rgba(77, 107, 254, .4);
  }
  #send:hover:not(:disabled) { transform: scale(1.06); background: #3f5cf0; }
  #send:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  #send svg { width: 18px; height: 18px; }
  .hint { font-size: 11.5px; color: var(--muted); text-align: center; }

  @media (max-width: 900px) {
    aside { position: absolute; right: 0; top: 61px; bottom: 0; box-shadow: var(--shadow-float); z-index: 20; }
    aside.hidden { margin-right: 0; transform: translateX(100%); }
    aside { transition: transform .28s ease, margin-right .28s ease; }
  }
  @media (max-width: 640px) {
    #chat { padding: 24px 16px 16px; gap: 22px; }
    .welcome h2 { font-size: 21px; }
    .brand .model { display: none; }
    #status { font-size: 0; padding: 6px 9px; }
    .msg.user .text { max-width: 92%; }
    #theme { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>RAG Inmobiliaria</h1>
    <span class="model">gpt-oss:20b &middot; bge-m3</span>
  </div>
  <div class="head-right">
    <span id="status">Conectando...</span>
    <button class="icon-btn" id="doc-toggle" title="Documentos indexados" aria-label="Documentos indexados">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></svg>
    </button>
    <button class="icon-btn" id="newchat" title="Nueva conversación" aria-label="Nueva conversación">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="theme" title="Cambiar tema" aria-label="Cambiar tema">
      <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div id="layout">
  <main id="chat"></main>

  <aside id="docs">
    <div class="docs-head">Documentos indexados <span class="n" id="doc-count">0</span></div>
    <div id="doc-list"><div class="docs-empty">Cargando...</div></div>
  </aside>
</div>

<footer>
  <div class="composer">
    <div class="shell">
      <textarea id="input" rows="1" placeholder="Pregunta sobre los manuales..." autocomplete="off"></textarea>
      <button id="send" title="Enviar (Enter)" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="hint">Enter envía &middot; Shift+Enter nueva línea &middot; Las citas abren el PDF en la página exacta</div>
  </div>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const main = document.querySelector("main");
const API_BASE = (location.port === "8000") ? "" : "http://127.0.0.1:8000";
const HISTORY_KEY = "rag-chat-v1";
const refs = {};

const SUGGESTIONS = [
  {
    icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    q: "¿Cuál es el SLA de primer contacto?",
    d: "Tiempo máximo de respuesta al lead"
  },
  {
    icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.5a3.5 3.5 0 0 1 0 6.8M16.5 15a5.5 5.5 0 0 1 4 5"/></svg>',
    q: "¿Cómo se asigna un lead a un asesor?",
    d: "Criterios y reglas de asignación"
  },
  {
    icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 9 3 3-3 3M13 15h4"/></svg>',
    q: "¿Qué comandos del CRM existen?",
    d: "Comandos y su función exacta"
  },
  {
    icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8.5 4.5L12 11 3.5 6.5 12 2z"/><path d="m3.5 12 8.5 4.5 8.5-4.5M3.5 17.5 12 22l8.5-4.5"/></svg>',
    q: "¿Cuáles son las etapas del lead?",
    d: "Flujo completo de manejo de prospectos"
  }
];

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[(\d{1,2})\]/g, '<button class="cite" data-ref="$1" onclick="openPdfRef(event, this)" title="Abrir PDF">$1</button>');
}

function renderAnswer(text) {
  const codeBlocks = [];
  let t = escapeHtml(text).replace(/```([\s\S]*?)```/g, (m, c) => {
    codeBlocks.push(c);
    return "\u0001CODE" + (codeBlocks.length - 1) + "\u0001";
  });
  const lines = t.split("\n");
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(list); list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim() === "") { flush(); continue; }
    if (/^#{1,4}\s+/.test(line)) { flush(); out.push("<h3>" + inline(line.replace(/^#{1,4}\s+/, "")) + "</h3>"); continue; }
    if (/^[-*]\s+/.test(line) || /^\d+[.)]\s+/.test(line)) {
      if (!list) list = { tag: /^\d+/.test(line) ? "ol" : "ul", items: [] };
      list.items.push(inline(line.replace(/^[-*]\s+/, "").replace(/^\d+[.)]\s+/, "")));
      continue;
    }
    flush();
    out.push("<p>" + inline(line) + "</p>");
  }
  flush();
  const html = out.map(b => typeof b === "string" ? b :
    "<" + b.tag + ">" + b.items.map(x => "<li>" + x + "</li>").join("") + "</" + b.tag + ">"
  ).join("\n");
  return html.replace(/\u0001CODE(\d+)\u0001/g, (m, i) => "<pre><code>" + codeBlocks[+i] + "</code></pre>");
}

function scrollBottom() { main.scrollTop = main.scrollHeight; }

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return "Buenos días";
  if (h < 19) return "Buenas tardes";
  return "Buenas noches";
}

function buildWelcome() {
  const w = document.createElement("div");
  w.className = "welcome";
  w.innerHTML =
    '<div class="logo-big">' +
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>' +
    '</div>' +
    '<h2>' + greeting() + ' — ¿qué quieres consultar?</h2>' +
    '<p>Respuestas sobre los manuales de procesos del CRM y manejo de leads, citando el archivo, la página y el párrafo exactos. En el panel derecho están los documentos indexados.</p>' +
    '<div class="suggest-grid"></div>';
  const grid = w.querySelector(".suggest-grid");
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.className = "sug";
    b.innerHTML = '<span class="ic">' + s.icon + '</span><span><b>' + escapeHtml(s.q) + "</b><span>" + escapeHtml(s.d) + "</span></span>";
    b.addEventListener("click", () => ask(s.q));
    grid.appendChild(b);
  });
  return w;
}

function addUser(q) {
  const m = document.createElement("div");
  m.className = "msg user";
  m.innerHTML = '<div class="text">' + escapeHtml(q) + "</div>";
  chat.appendChild(m);
  scrollBottom();
  return m;
}

function addBotAnswer(html) {
  const m = document.createElement("div");
  m.className = "msg bot";
  m.innerHTML = '<div class="answer">' + html + "</div>";
  chat.appendChild(m);
  scrollBottom();
  return m;
}

function addTyping() {
  const m = document.createElement("div");
  m.className = "msg bot";
  m.innerHTML = '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  chat.appendChild(m);
  scrollBottom();
  return m;
}

function pdfUrl(file, page) {
  const p = parseInt(page, 10) || 1;
  return API_BASE + "/pdf/" + encodeURIComponent(file) + "#page=" + p;
}

function openPdf(file, page) {
  window.open(pdfUrl(file, page), "_blank");
}

function openPdfFile(btn) {
  openPdf(btn.getAttribute("data-file"), btn.getAttribute("data-page"));
}

function openPdfRef(ev, btn) {
  ev.preventDefault();
  const r = refs[btn.getAttribute("data-ref")];
  if (r) openPdf(r.file, r.page);
}

function renderSources(sources) {
  if (!sources || !sources.length) return "";
  const items = sources.map(s => {
    refs[s.ref] = { file: s.file, page: s.page };
    const pct = Math.max(0, Math.min(100, Math.round((s.score || 0) * 100)));
    const pn = parseInt(s.page, 10) || "?";
    const par = parseInt(s.paragraph, 10) || "?";
    return '<details class="source" data-ref="' + s.ref + '">' +
      '<summary>' +
        '<span class="s-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></span>' +
        '<span class="s-file">' + escapeHtml(s.file) + "</span>" +
        '<span class="s-page">p.' + pn + " &middot; párr." + par + "</span>" +
        '<span class="chev">&#9662;</span>' +
      "</summary>" +
      '<div class="s-body">' +
        '<div class="s-score">Relevancia ' + pct + '%<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<button class="pdf-btn" data-file="' + escapeHtml(s.file) + '" data-page="' + pn + '" onclick="openPdfFile(this)">Abrir PDF en la página ' + pn + "</button>" +
        '<div class="s-excerpt">' + escapeHtml(s.text) + "</div>" +
      "</div></details>";
  }).join("");
  return '<div class="sources"><div class="sources-title">Fuentes</div>' + items + "</div>";
}

function addCopyButton(msg, rawText) {
  const row = document.createElement("div");
  row.className = "actions";
  const btn = document.createElement("button");
  btn.className = "ghost-btn";
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copiar respuesta</span>';
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(rawText);
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>Copiada</span>';
      setTimeout(() => {
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copiar respuesta</span>';
      }, 1500);
    } catch (e) { /* clipboard no disponible */ }
  });
  row.appendChild(btn);
  msg.appendChild(row);
}

/* ===== Caché de conversaciones (localStorage) ===== */

function saveHistory() {
  const items = [];
  for (const el of chat.children) {
    if (!el.classList.contains("msg")) continue;
    if (el.querySelector(".typing")) continue;
    if (el.classList.contains("user")) {
      const t = el.querySelector(".text");
      if (t) items.push({ role: "user", q: t.textContent });
      continue;
    }
    if (!el._raw) continue;
    items.push({ role: "bot", answer: el._raw, sources: el._sources || [] });
  }
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); } catch (e) { /* almacenamiento lleno */ }
}

function restoreHistory() {
  let items = [];
  try { items = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { items = []; }
  if (!items.length) return false;
  for (const it of items) {
    if (it.role === "user") { addUser(it.q); continue; }
    const m = addBotAnswer(renderAnswer(it.answer) + renderSources(it.sources || []));
    addCopyButton(m, it.answer);
  }
  return true;
}

function newChat() {
  try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
  chat.innerHTML = "";
  chat.appendChild(buildWelcome());
  input.focus();
}

/* ===== Consulta ===== */

async function ask(text) {
  const q = (text !== undefined) ? text : input.value.trim();
  if (!q) return;
  input.value = "";
  autoGrow();
  addUser(q);
  send.disabled = true;
  const typing = addTyping();
  try {
    const res = await fetch(API_BASE + "/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, rerank: false })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    typing.remove();
    const m = addBotAnswer(renderAnswer(data.answer) + renderSources(data.sources));
    m._raw = data.answer;
    m._sources = data.sources;
    addCopyButton(m, data.answer);
    saveHistory();
  } catch (err) {
    typing.remove();
    const em = addBotAnswer('<div class="answer"><p><strong>Error al consultar el RAG</strong></p>' +
      "<p>" + escapeHtml(String(err)) + "</p>" +
      "<p>Verifica que la API esté corriendo: <code>.\\rag.bat</code> (opción 5).</p></div>");
    em.classList.add("error");
  } finally {
    send.disabled = false;
    input.focus();
  }
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}

/* ===== Panel de documentos ===== */

const aside = document.getElementById("docs");
const docToggle = document.getElementById("doc-toggle");
docToggle.addEventListener("click", () => {
  aside.classList.toggle("hidden");
  docToggle.classList.toggle("on", !aside.classList.contains("hidden"));
});
if (window.innerWidth < 900) aside.classList.add("hidden");

async function loadDocs() {
  const listEl = document.getElementById("doc-list");
  const countEl = document.getElementById("doc-count");
  try {
    const r = await fetch(API_BASE + "/documents", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const docs = data.documents || [];
    countEl.textContent = String(docs.length);
    listEl.innerHTML = "";
    if (!docs.length) {
      listEl.innerHTML = '<div class="docs-empty">No hay documentos en data/</div>';
      return;
    }
    docs.forEach(d => {
      const b = document.createElement("button");
      b.className = "doc";
      b.innerHTML = '<span class="d-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></span>' +
        '<span class="d-txt"><b>' + escapeHtml(d.file) + '</b><i>' + d.pages + " páginas &middot; " + d.size_kb + " KB</i></span>";
      b.addEventListener("click", () => openPdf(d.file, 1));
      listEl.appendChild(b);
    });
  } catch (e) {
    countEl.textContent = "—";
    listEl.innerHTML = '<div class="docs-empty">API apagada.<br>Corre: .\\rag.bat (opción 5)</div>';
  }
}
loadDocs();

/* ===== Tema ===== */
const htmlEl = document.documentElement;
const iconSun = document.getElementById("icon-sun");
const iconMoon = document.getElementById("icon-moon");
function applyTheme(t) {
  htmlEl.setAttribute("data-theme", t);
  iconSun.style.display = t === "dark" ? "none" : "block";
  iconMoon.style.display = t === "dark" ? "block" : "none";
}
applyTheme(localStorage.getItem("rag-theme") || "light");
document.getElementById("theme").addEventListener("click", () => {
  const next = htmlEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("rag-theme", next);
  applyTheme(next);
});

/* ===== Estado API ===== */
const status = document.getElementById("status");
async function checkHealth() {
  try {
    const r = await fetch(API_BASE + "/health", { cache: "no-store" });
    status.classList.toggle("ok", r.ok);
    status.textContent = r.ok ? "API en línea" : "API apagada";
  } catch (e) {
    status.classList.remove("ok");
    status.textContent = "API apagada";
  }
}
checkHealth();
setInterval(checkHealth, 15000);

/* ===== Init ===== */
send.addEventListener("click", () => ask());
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
input.addEventListener("input", autoGrow);
document.getElementById("newchat").addEventListener("click", newChat);

if (!restoreHistory()) chat.appendChild(buildWelcome());
</script>
</body>
</html>
